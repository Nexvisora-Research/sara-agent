name: sara_voice
description: Sara Agent Voice Assistant - Flutter frontend for voice-controlled AI.
version: 1.0.0

environment:
  sdk: ">=3.2.0 <4.0.0"

dependencies:
  flutter:
    sdk: flutter

  # Networking
  web_socket_channel: ^2.4.0
  http: ^1.1.0
  uuid: ^4.1.0

  # Audio
  record: ^6.1.2
  audioplayers: ^5.2.0
  audio_session: ^0.1.16

  # State management
  provider: ^6.0.5
  riverpod: ^2.4.0
  flutter_riverpod: ^2.4.0

  # UI
  cupertino_icons: ^1.0.6
  flutter_animate: ^4.2.0

  # Background services
  flutter_background_service: ^4.0.0
  flutter_local_notifications: ^16.1.0
  wakelock_plus: ^1.1.0

  # Permissions
  permission_handler: ^11.0.1

  # Storage
  shared_preferences: ^2.2.1
  hive_flutter: ^1.1.0

  # Utilities
  path_provider: ^2.1.0
  connectivity_plus: ^5.0.1
  device_info_plus: ^9.1.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^3.0.1

flutter:
  uses-material-design: true
